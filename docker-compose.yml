services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maijong
      POSTGRES_PASSWORD: maijong
      POSTGRES_DB: maijong
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maijong"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # S3-compatible replay store (MinIO no longer publishes images); keys in deploy/seaweedfs-s3.json
  s3:
    image: chrislusf/seaweedfs:4.05
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://maijong:maijong@postgres:5432/maijong
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-0123456789}
      CORS_ORIGINS: http://localhost:3000
      REPLAY_DIR: /data/replays
      # uploaded agents and other app files; must outlive the container
      MAIJONG_DATA_DIR: /data/app
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_BUCKET: maijong-replays
      S3_ACCESS_KEY: maijong
      S3_SECRET_KEY: maijong-secret
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ARENA_INTERVAL: ${ARENA_INTERVAL:-0}
    ports: ["8000:8000"]
    volumes: [replays:/data/replays, appdata:/data/app]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  # image for sandboxed agent submissions (build only):  docker compose build sandbox
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: maijong-sandbox
    profiles: ["tools"]

volumes:
  appdata:
  pgdata:
  s3data:
  replays:
