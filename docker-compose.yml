services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maijong
      POSTGRES_PASSWORD: maijong
      POSTGRES_DB: maijong
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maijong"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maijong
      MINIO_ROOT_PASSWORD: maijong-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://maijong:maijong@postgres:5432/maijong
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-0123456789}
      CORS_ORIGINS: http://localhost:3000
      REPLAY_DIR: /data/replays
    ports: ["8000:8000"]
    volumes: [replays:/data/replays]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  replays:
