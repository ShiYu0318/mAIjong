[project]
name = "maijong"
version = "0.1.0"
description = "Taiwanese 16-tile mahjong research platform: rule engine, online play, and RL training."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]
ai = [
    "numpy>=1.26",
    "torch>=2.3",
    "gymnasium>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "ai", "backend", "sdk/maijong_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["engine", "backend", "maijong_sdk"]
mypy_path = "sdk"
strict = true
exclude = ["backend/migrations"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
omit = ["engine/cli.py"]

[[tool.mypy.overrides]]
module = ["backend.tasks.training_tasks", "celery.*"]
ignore_errors = true
ignore_missing_imports = true
