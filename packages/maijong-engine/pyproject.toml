[project]
name = "maijong-engine"
version = "0.1.0"
description = "Taiwanese 16-tile mahjong rule engine used by mAIjong."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ShiYu Huang (黃士育)" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../engine" = "engine"
