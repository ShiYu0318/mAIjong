name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f Dockerfile.backend -t maijong-backend .
          docker build -f Dockerfile.frontend -t maijong-frontend .
          docker build -f Dockerfile.sandbox -t maijong-sandbox .
      - name: Sandbox runs an agent with no network
        run: |
          mkdir -p /tmp/sub && cp sdk/examples/random_agent.py /tmp/sub/agent.py
          echo '{"agent_class": "MyRandomAgent"}' > /tmp/sub/manifest.json
          echo '{"op": "quit"}' | docker run --rm -i --network none --memory 512m \
            -v /tmp/sub:/submission:ro maijong-sandbox
      - name: Backend starts and answers health checks
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/m.db maijong-backend
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && exit 0; sleep 2; done
          docker logs api; exit 1
