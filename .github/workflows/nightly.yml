name: Nightly simulation

on:
  schedule:
    - cron: "0 18 * * *"  # 02:00 Asia/Taipei
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Simulate
        run: uv run python scripts/nightly_sim.py --soak 1000 --pairs 100 --workers 4
